name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days of inactivity. This
# workflow pings the fuel_prices table twice a week (Mon + Thu, 06:00 UTC)
# so the inactivity timer never reaches that threshold. The ping uses the
# same anon key that's already in the public JS bundle - no extra secrets
# to manage and no privileges beyond what visitors already have.
#
# It is OK to delete this workflow if you upgrade to Supabase Pro (which
# removes the inactivity pause entirely) or if you migrate off Supabase.

on:
  schedule:
    # Daily. The odd minute (:17) is deliberate - GitHub delays or skips
    # on-the-hour schedules far more often because of load spikes.
    - cron: '17 5 * * *'
  workflow_dispatch:        # manual trigger in case you ever need it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping fuel_prices table
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Supabase secrets are not set; nothing to ping."
            exit 1
          fi

          # `select=fuel_type&limit=1` keeps the response minimal but still
          # counts as activity on the project. `-sfS` makes curl fail loudly
          # on any non-2xx response so a broken cron shows up as a red run
          # rather than silently doing nothing.
          curl -sfS \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/fuel_prices?select=fuel_type&limit=1" \
            -o /dev/null

          echo "✅ Supabase pinged - inactivity timer reset."
