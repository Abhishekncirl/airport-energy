name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel any older in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Vite reads these env vars at build time and inlines them into the
        # bundle. Set them in repo Settings → Secrets and variables → Actions.
        # If they're missing the build still succeeds and the site falls back
        # to hardcoded prices + a "not configured" admin notice.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths.
      # Copying index.html → 404.html lets React Router handle deep links
      # like /coffee-snacks on first load.
      #
      # The repo-root CNAME is copied into the artifact so GitHub Pages
      # picks up the custom domain (Pages-via-Actions only reads the
      # artifact, not the repo root).
      - name: Add SPA 404 fallback + CNAME
        run: |
          cp dist/index.html dist/404.html
          cp CNAME dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
